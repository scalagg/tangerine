plugins {
    id "maven-publish"
    id "com.jfrog.artifactory" version "4.28.2"
    id "org.jetbrains.kotlin.jvm" version "1.6.21"
    id "org.jetbrains.kotlin.kapt" version "1.6.21"
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

group "gg.scala.tangerine"
version "1.2.0"

String environmental(String key)
{
    final String environment =
        System.getenv(key)

    if (environment != null)
    {
        return environment
    }

    return project.property(key)
}

repositories {
    mavenCentral()

    maven {
        name "scala"
        url "${environmental("artifactory_contextUrl")}/gradle-release"

        credentials {
            username environmental("artifactory_user")
            password environmental("artifactory_password")
        }
    }

    maven { url "https://papermc.io/repo/repository/maven-public/" }
    maven { url "https://jitpack.io" }
    maven { url "https://repo.extendedclip.com/content/repositories/placeholderapi/" }
}

dependencies {
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:1.6.21"

    compileOnly "xyz.xenondevs:particle:1.7.1"
    compileOnly "io.papermc:paperlib:1.0.6"

    compileOnly "me.lucko:helper:5.6.10.1"
    kapt "me.lucko:helper:5.6.10.1"

    compileOnly "gg.scala.store:spigot:0.1.3"
    compileOnly "gg.scala.cookie:Cookie:1.1.5"

    implementation "io.github.nosequel.tab:shared:1.1-SNAPSHOT"
    implementation "io.github.nosequel.tab:v1_8_R3:1.1-SNAPSHOT"
    implementation "io.github.nosequel.tab:v1_12_R1:1.1-SNAPSHOT"

    compileOnly "com.github.mkotb:ConfigAPI:e1c8df3f13"

    compileOnly "me.clip:placeholderapi:2.10.10"
    compileOnly "gg.scala.commons:bukkit:2.0.0"

    compileOnly "gg.scala.lemon:bukkit:1.2.1"
    compileOnly "gg.scala.spigot:sspigot-server:1.0.7"

    compileOnly "gg.scala.cgs:lobby:1.0.6"
    compileOnly "gg.scala.cougar:spigot:1.0.3"
}

compileKotlin {
    kotlinOptions.javaParameters = true
    kotlinOptions.jvmTarget = "1.8"
}

shadowJar {
    archiveClassifier.set("")

    exclude "**/*.kotlin_metadata"
    exclude "**/*.kotlin_builtins"
    exclude "META-INF/"

    archiveFileName = "Tangerine.jar"
}

publishing {
    publications {
        shadow(MavenPublication) { publication ->
            project.shadow.component(publication)
        }
    }

    repositories {
        maven {
            name "scala"
            url "${environmental("artifactory_contextUrl")}/gradle-release"

            credentials {
                username environmental("artifactory_user")
                password environmental("artifactory_password")
            }
        }
    }
}

artifactory {
    this.contextUrl = environmental("artifactory_contextUrl")

    publish {
        repository {
            repoKey = environmental("artifactory_release_local")
            username = environmental("artifactory_user")
            password = environmental("artifactory_password")
            maven = true
        }
    }
}

tasks.build.dependsOn(
    shadowJar,
    publishShadowPublicationToScalaRepository
)
