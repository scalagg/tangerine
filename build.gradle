plugins {
    id "maven-publish"
    id "com.jfrog.artifactory" version "4.29.2"
    id "org.jetbrains.kotlin.jvm" version "1.7.20"
    id "org.jetbrains.kotlin.kapt" version "1.7.20"
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

group "gg.scala.tangerine"
version "1.2.4"

repositories {
    mavenCentral()

    maven {
        name "scala"
        url "${property("artifactory_contextUrl")}/gradle-release"

        credentials {
            username property("artifactory_user")
            password property("artifactory_password")
        }
    }

    maven { url "https://papermc.io/repo/repository/maven-public/" }
    maven { url "https://jitpack.io" }
    maven { url "https://repo.extendedclip.com/content/repositories/placeholderapi/" }
}

dependencies {
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:1.7.10"

    compileOnly "xyz.xenondevs:particle:1.7.1"
    compileOnly "io.papermc:paperlib:1.0.6"

    kapt "gg.scala.commons:bukkit:3.0.3"
    compileOnly "gg.scala.commons:bukkit:3.0.3"

    compileOnly "gg.scala.store:spigot:0.1.3"
    compileOnly "gg.minequest.duels:external:1.0.0"
    compileOnly "gg.scala.cookie:Cookie:1.1.5"

    compileOnly "me.clip:placeholderapi:2.10.10"
    compileOnly "gg.scala.commons:bukkit:2.1.2"
    compileOnly "gg.scala.cloudsync:spigot:1.0.1"

    compileOnly "gg.scala.lemon:bukkit:1.4.0"
    compileOnly "gg.scala.staff:scala-scstaff-plugin:1.0.0"

    compileOnly "gg.scala.spigot:server:1.1.0"

    compileOnly "gg.scala.cgs:lobby:1.1.2"
    compileOnly "gg.scala.cougar:spigot:1.0.3"
}

compileKotlin {
    kotlinOptions.javaParameters = true
    kotlinOptions.jvmTarget = "17"
}

shadowJar {
    archiveClassifier.set("")

    exclude "**/*.kotlin_metadata"
    exclude "**/*.kotlin_builtins"
    exclude "META-INF/"

    archiveFileName = "Tangerine.jar"
}

publishing {
    publications {
        shadow(MavenPublication) { publication ->
            project.shadow.component(publication)
        }
    }

    repositories {
        maven {
            name "scala"
            url "${property("artifactory_contextUrl")}/gradle-release"

            credentials {
                username property("artifactory_user")
                password property("artifactory_password")
            }
        }
    }
}

artifactory {
    this.contextUrl = property("artifactory_contextUrl")

    publish {
        repository {
            repoKey = property("artifactory_release_local")
            username = property("artifactory_user")
            password = property("artifactory_password")
            maven = true
        }
    }
}

tasks.build.dependsOn(
    shadowJar,
    publishShadowPublicationToScalaRepository
)
