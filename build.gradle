plugins {
    id "maven-publish"
    id "org.jetbrains.kotlin.jvm" version "1.6.0"
    id "com.github.johnrengelman.shadow" version "5.2.0"
}

def gitHash = { ->
    def stdout = new ByteArrayOutputStream()

    exec {
        commandLine 'git', 'rev-parse', '--short', 'HEAD'
        standardOutput = stdout
    }

    return stdout.toString()
            .trim().toString()
} as String

def gitBranch = { ->
    def stdout = new ByteArrayOutputStream()

    exec {
        commandLine 'git', 'branch', '--show-current'
        standardOutput = stdout
    }

    return stdout.toString()
            .trim().toString()
} as String

group 'gg.scala'
version gitHash

repositories {
    mavenLocal()
    mavenCentral()

    maven {
        name "papermc"
        url "https://papermc.io/repo/repository/maven-public/"
    }

    maven {
        url 'https://jitpack.io'
    }

    maven {
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.6.0'

    compileOnly 'xyz.xenondevs:particle:1.6.6'

    compileOnly "io.papermc:paperlib:1.0.6"

    implementation 'com.github.NoSequel:TabAPI:d2c627839e'
    compileOnly "com.github.mkotb:ConfigAPI:e1c8df3f13"

    compileOnly 'me.clip:placeholderapi:2.10.10'
    compileOnly "org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT"

    implementation "gg.scala.flavor:flavor:0.1.1"

    compileOnly fileTree("lib")
}

compileKotlin {
    kotlinOptions.javaParameters = true
    kotlinOptions.jvmTarget = "1.8"
}

shadowJar {
    archiveClassifier.set("")

    exclude "**/*.kotlin_metadata"
    exclude "**/*.kotlin_builtins"
    exclude "META-INF/"

    archiveFileName = "Tangerine.jar"
}

publishing {
    publications {
        shadow(MavenPublication) { publication ->
            project.shadow.component(publication)
        }
    }
}

tasks.build.dependsOn(shadowJar, publishShadowPublicationToMavenLocal)
